[package]
name = "openmodelica_codegen_wasm_jit"
version = "0.1.0"
edition = "2024"

[dependencies]
metamodelica.workspace = true
openmodelica_ast.workspace = true
openmodelica_simcode_types.workspace = true
openmodelica_frontend_types.workspace = true
openmodelica_frontend_dump.workspace = true
openmodelica_util.workspace = true
anyhow.workspace = true
arcstr.workspace = true
ordered-float.workspace = true
wasm-encoder.workspace = true
daskr = { path = "../daskr" }

# wasmer backend selected by target: native uses the `sys` cranelift JIT; the
# wasm32 build uses the `js` backend, which forwards to the host JS engine's
# `WebAssembly` API (the one engine that can JIT inside browser-wasm). See
# CodegenWasmJit/sim_runtime.rs and CodegenWasmJitFunctions/runtime.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { workspace = true, features = ["sys", "cranelift"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmer = { workspace = true, features = ["js"] }
